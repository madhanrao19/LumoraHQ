name: lumora-mobile CI

# See lumora-api.yml for why there's no top-level `paths:` filter.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'lumora-mobile/**'

  lumora-mobile-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumora-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lumora-mobile/package-lock.json

      - run: npm ci

      # expo-env.d.ts is intentionally gitignored (Expo's own convention —
      # "should be in your git ignore", auto-restored by the Expo CLI on
      # first run). Its content is fixed, not project-specific, so write it
      # directly rather than starting a dev server in CI just to have Expo
      # regenerate it.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
