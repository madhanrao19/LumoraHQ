name: lumora-mobile CI

on:
  push:
    branches: [ main ]
    paths: [ 'lumora-mobile/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'lumora-mobile/**' ]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: lumora-mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lumora-mobile/package-lock.json

      - run: npm ci

      # expo-env.d.ts is intentionally gitignored (Expo's own convention —
      # "should be in your git ignore", auto-restored by the Expo CLI on
      # first run). Its content is fixed, not project-specific, so write it
      # directly rather than starting a dev server in CI just to have Expo
      # regenerate it.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
