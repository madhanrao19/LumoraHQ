name: lumora-api CI

# No top-level `paths:` filter — a workflow that never triggers posts no
# status at all, and a required check with no status blocks merge forever
# (confirmed empirically). Instead the workflow always runs, and the real
# job is skipped via a job-level `if:` when nothing relevant changed — a
# skipped job still posts a "skipped" check, which GitHub's required-status-
# checks accepts as satisfying the requirement.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'lumora-api/**'

  lumora-api-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumora-api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pgsql, pdo_pgsql
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('lumora-api/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist

      - run: cp .env.example .env
      - run: php artisan key:generate

      - name: Pint (format check)
        run: vendor/bin/pint --test

      - name: Pest
        run: php artisan test --compact
