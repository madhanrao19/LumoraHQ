name: Build Docs

on:
  push:
    branches: [ main, master ]
    paths: [ 'lumora-docs/**' ]
  pull_request:
    branches: [ main, master ]
    paths: [ 'lumora-docs/**' ]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: lumora-docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
